name: Auto Linter

on:
  push:
    paths:
      - "**/*.py"
  pull_request:
    paths:
      - "**/*.py"
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linter
        run: pip install ruff

      - name: Run Linter
        run: ruff check .

      - name: Check Formatting
        run: ruff format --check .


